<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errore 404 - Pagina non trovata</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/android-chrome-192x192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/index.css">
  <script src="loading/loading.js" defer></script>

  <script>
    (() => {
      const savedTheme = localStorage.getItem("theme");
      const savedFontSize = localStorage.getItem("fontSize");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("preload-dark");
      }

      if (savedFontSize === "large") {
        document.documentElement.classList.add("preload-large-text");
      }
    })();
  </script>
</head>
<body>

  <main class="error-page">
    <div class="container">
      <div class="error-card text-center">
        <div class="error-code">404</div>
        <div class="error-line"></div>
        <h1 class="error-title">Pagina non trovata</h1>
        <p class="error-text">La pagina che stai cercando non esiste, è stata spostata oppure il collegamento non è corretto.</p>
        <div class="error-actions">
          <a href="/" class="error-btn"><i class="bi bi-house-door"></i>Torna alla home</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme");
      const savedFontSize = localStorage.getItem("fontSize");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      }
      if (savedFontSize === "large") {
        document.body.classList.add("large-text");
      }
      document.documentElement.classList.remove("preload-dark", "preload-large-text");
    });
  </script>

</body>
</html>
